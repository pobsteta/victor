<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>V.I.C.T.O.R.</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/gridjs/dist/theme/mermaid.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
<script src="https://unpkg.com/gridjs/dist/gridjs.umd.js"></script>
<style>
  /* Palette unique « sous-bois au petit matin » : tons désaturés, contrastes doux,
     ni noir pur ni blanc pur, pour un écran reposant. RGB sans parenthèses → rgba(var(--x), a). */
  :root {
    --a1: 156,190,164;  --a2: 196,176,132;  --deep: 14,22,17;
    --bg: #0c130f; --glow: rgba(70,100,80,.22);
    --cyan: rgb(var(--a1)); --cyan-dim: #5d7a66; --amber: rgb(var(--a2));
    --text: #dde6df; --text2: #b4c4b8; --dim: #71877a; --ok: #a8cf8e; --err: #d9826f;
    --core: 236,243,238; --core-dark: 18,28,22;
    --s1: #7fae8c; --s2: #c49a5a; --s3: #7f9fb8;
  }
  :root {
    --fs: 1;   /* taille du texte de toute l'interface (boutons A− / A+) */
    --side: calc(340px * min(var(--fs), 1.35));
    --panel: rgba(var(--deep),.78); --line: rgba(var(--a1),.18);
    --font-hud: "Rajdhani", sans-serif; --font-mono: "Share Tech Mono", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background:
      radial-gradient(1100px 650px at 50% 38%, var(--glow) 0%, transparent 60%),
      var(--bg);
    color: var(--text); font-family: var(--font-hud);
    height: 100vh; overflow: hidden; display: flex;
  }
  /* fond : courbes de niveau (dessinées en JS sur ce canvas) */
  #topo { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
  /* subtle vignette */
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    box-shadow: inset 0 0 220px rgba(0,0,0,.55);
  }

  /* ------------------------------------------------ HUD chrome */
  .corner { position: fixed; width: 46px; height: 46px; pointer-events: none; z-index: 5; }
  .corner::before { content: ""; position: absolute; inset: 0; border: 2px solid var(--cyan); opacity: .55; }
  .corner.tl { top: 14px; left: 14px; } .corner.tl::before { border-right: 0; border-bottom: 0; }
  .corner.tr { top: 14px; right: calc(var(--side) + 18px); } .corner.tr::before { border-left: 0; border-bottom: 0; }
  .corner.bl { bottom: 14px; left: 14px; } .corner.bl::before { border-right: 0; border-top: 0; }
  .corner.br { bottom: 14px; right: calc(var(--side) + 18px); } .corner.br::before { border-left: 0; border-top: 0; }

  #topbar {
    position: fixed; top: 20px; left: 80px; right: calc(var(--side) + 80px); z-index: 5;
    display: flex; justify-content: space-between; align-items: center;
    font-family: var(--font-mono); font-size: calc(11px * var(--fs)); color: var(--dim);
    letter-spacing: .28em; text-transform: uppercase;
  }
  #fontctl { display: flex; align-items: center; gap: 6px; letter-spacing: .08em; }
  #fontctl button {
    min-width: calc(34px * min(var(--fs), 1.3)); height: calc(26px * min(var(--fs), 1.3)); padding: 0 8px; cursor: pointer;
    background: rgba(var(--deep),.6); color: var(--text); border: 1px solid var(--line);
    font-family: var(--font-hud); font-size: calc(14px * min(var(--fs), 1.3)); font-weight: 600; letter-spacing: 0;
  }
  #fontctl button:hover { border-color: var(--cyan); color: var(--cyan); }
  #fontctl button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  #fontctl button:disabled { opacity: .35; cursor: default; }
  #fs-val { min-width: 42px; text-align: center; }
  #fullscreen { margin-right: 8px; }
  #fullscreen[aria-pressed="true"] { border-color: var(--cyan); color: var(--cyan); }
  #topbar .sys { color: var(--cyan); text-shadow: 0 0 12px rgba(var(--a1),.8); }
  #clock { color: var(--amber); }

  #stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
  #orb { width: min(62vh, 580px); height: min(62vh, 580px); margin: -50px 0 -40px; cursor: pointer; filter: drop-shadow(0 0 35px rgba(var(--a1),.25)); }
  #status {
    margin-top: 6px; letter-spacing: .45em; text-transform: uppercase;
    font-size: calc(12px * var(--fs)); font-weight: 600; color: var(--dim); font-family: var(--font-mono);
  }
  #status b { color: var(--cyan); font-weight: 600; text-shadow: 0 0 14px rgba(var(--a1),.9); }
  #hint { position: absolute; bottom: 22px; font-size: calc(11px * var(--fs)); color: var(--dim); font-family: var(--font-mono); letter-spacing: .2em; }
  #transcript {
    position: absolute; top: 54px; left: 50%; transform: translateX(-50%);
    max-width: 68%; text-align: center; font-size: calc(15px * var(--fs)); font-weight: 500;
    color: var(--text2); min-height: 22px; text-shadow: 0 0 18px rgba(var(--a1),.35);
  }

  #transcript.user { color: var(--dim); font-style: italic; }
  #ask { margin-top: 18px; width: min(calc(420px * var(--fs)), 80%); }
  #ask input {
    width: 100%; background: rgba(var(--deep),.6); border: 1px solid var(--line);
    border-bottom: 2px solid var(--cyan-dim); color: var(--text); padding: 8px 12px;
    font-family: var(--font-mono); font-size: calc(13px * var(--fs)); letter-spacing: .04em; outline: none;
  }
  #ask input:focus { border-bottom-color: var(--cyan); box-shadow: 0 6px 18px -10px rgba(var(--a1),.6); }
  #ask input::placeholder { color: var(--dim); }

  /* ------------------------------------------------ display cards (HUD holograms) */
  #cards {
    position: absolute; top: 96px; left: 34px; bottom: 30px; width: min(calc(330px * var(--fs)), 40vw);
    display: flex; flex-direction: column; gap: 14px; overflow-y: auto;
    pointer-events: none; scrollbar-width: none; z-index: 4;
  }
  .card {
    pointer-events: auto; position: relative;
    background: linear-gradient(135deg, rgba(var(--a1),.10), rgba(var(--deep),.85) 45%);
    border: 1px solid var(--line); border-left: 3px solid var(--cyan);
    padding: 12px 14px 12px 16px; backdrop-filter: blur(6px);
    clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 0 100%);
    animation: materialize .45s cubic-bezier(.2,.9,.3,1);
    box-shadow: 0 0 24px rgba(var(--a1),.10), inset 0 0 30px rgba(var(--a1),.04);
  }
  @keyframes materialize {
    0% { transform: translateX(-24px) skewX(-4deg); opacity: 0; filter: brightness(3); }
    60% { filter: brightness(1.6); }
    100% { transform: none; opacity: 1; filter: none; }
  }
  .card.warning { border-left-color: var(--amber); }
  .card.result { border-left-color: var(--ok); }
  .card h3 {
    font-size: calc(12px * var(--fs)); letter-spacing: .3em; text-transform: uppercase; font-weight: 700;
    color: var(--cyan); margin-bottom: 8px; font-family: var(--font-mono);
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .card.warning h3 { color: var(--amber); } .card.result h3 { color: var(--ok); }
  .card h3 .x { cursor: pointer; color: var(--dim); font-size: calc(13px * var(--fs)); letter-spacing: 0; }
  .card h3 .x:hover { color: var(--err); }
  .card .body { font-size: calc(14px * var(--fs)); line-height: 1.5; color: var(--text); white-space: pre-wrap; word-break: break-word; }
  .card .body code {
    font-family: var(--font-mono); font-size: calc(12.5px * var(--fs)); color: var(--amber);
    background: rgba(var(--a2),.08); padding: 1px 5px; border-radius: 2px;
  }
  .card .body ul { margin: 4px 0 0 16px; }
  .card.code .body { font-family: var(--font-mono); font-size: calc(12px * var(--fs)); color: var(--text2); }
  .card .body pre { white-space: pre-wrap; margin: 4px 0; }
  .clip { display: flex; gap: 6px; margin: 2px 0 8px; white-space: normal; }
  .clip button {
    cursor: pointer; padding: 2px 8px; font-family: var(--font-mono); font-size: calc(11px * var(--fs));
    background: rgba(var(--deep),.6); color: var(--dim); border: 1px solid var(--line);
  }
  .clip button:hover:not(:disabled) { color: var(--cyan); border-color: var(--cyan); }
  .clip button:disabled { cursor: default; color: var(--amber); }

  /* ------------------------------------------------ right panel */
  #side {
    width: var(--side); flex-shrink: 0; border-left: 1px solid var(--line); background: var(--panel);
    backdrop-filter: blur(10px); padding: 18px; overflow-y: auto; z-index: 6;
  }
  #side h2 {
    font-size: calc(11px * var(--fs)); letter-spacing: .22em; text-transform: uppercase; color: var(--cyan);
    margin-bottom: 14px; font-family: var(--font-mono);
    border-bottom: 1px solid var(--line); padding-bottom: 10px;
    text-shadow: 0 0 10px rgba(var(--a1),.6);
  }
  .task {
    border: 1px solid var(--line); border-left: 3px solid var(--cyan);
    padding: 12px 14px; margin-bottom: 12px;
    background: linear-gradient(180deg, rgba(var(--a1),.06), transparent);
    clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%);
    animation: materialize .35s ease;
  }
  .task .t { font-size: calc(14px * var(--fs)); font-weight: 600; margin-bottom: 6px; letter-spacing: .04em; }
  .task .esp {
    display: inline-block; margin-left: 6px; padding: 0 6px; vertical-align: 2px;
    font-family: var(--font-mono); font-size: calc(10px * var(--fs)); font-weight: 400;
    letter-spacing: .14em; text-transform: uppercase; color: var(--amber);
    border: 1px solid rgba(var(--a2),.35); background: rgba(var(--a2),.06);
  }
  .task .s { font-size: calc(11px * var(--fs)); color: var(--dim); display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); }
  .task .out { font-size: calc(11px * var(--fs)); color: var(--text2); margin-top: 8px; max-height: calc(120px * var(--fs)); overflow: auto; white-space: pre-wrap; font-family: var(--font-mono); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 8px var(--cyan); animation: blink 1s infinite alternate; }
  .task.done { border-left-color: var(--ok); } .task.done .dot { background: var(--ok); box-shadow: 0 0 8px var(--ok); animation: none; }
  .task.error { border-left-color: var(--err); } .task.error .dot { background: var(--err); box-shadow: 0 0 8px var(--err); animation: none; }
  .task.cancelled { border-left-color: var(--dim); opacity: .65; } .task.cancelled .dot { background: var(--dim); box-shadow: none; animation: none; }
  .task .cancel { margin-left: auto; cursor: pointer; color: var(--dim); }
  .task .cancel:hover { color: var(--err); }
  @keyframes blink { to { opacity: .2; } }
  #empty { font-size: calc(12px * var(--fs)); color: var(--dim); font-style: italic; }

  /* ------------------------------------------------ report dashboard overlay */
  #report {
    position: fixed; inset: 60px calc(var(--side) + 40px) 40px 60px; z-index: 20; display: none;
    background: rgba(var(--deep),.96); border: 1px solid var(--line);
    border-top: 2px solid var(--cyan); backdrop-filter: blur(14px);
    box-shadow: 0 0 60px rgba(0,0,0,.7), 0 0 30px rgba(var(--a1),.08);
    padding: 22px 26px; overflow-y: auto; animation: materialize .35s ease;
  }
  #report.open { display: block; }
  #report .rhead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  #report .rhead h2 { font-size: calc(16px * var(--fs)); letter-spacing: .22em; text-transform: uppercase; color: var(--cyan); font-family: var(--font-mono); }
  #report .rhead .x { cursor: pointer; color: var(--dim); font-size: calc(18px * var(--fs)); }
  #report .rhead .x:hover { color: var(--err); }
  #kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(calc(150px * var(--fs)), 1fr)); gap: 12px; margin-bottom: 18px; }
  .kpi { border: 1px solid var(--line); border-left: 3px solid var(--cyan); padding: 12px 14px; background: rgba(var(--a1),.04); }
  .kpi .l { font-size: calc(11px * var(--fs)); letter-spacing: .18em; text-transform: uppercase; color: var(--dim); font-family: var(--font-mono); }
  .kpi .v { font-size: calc(26px * var(--fs)); font-weight: 700; color: var(--text); margin-top: 4px; }
  .kpi .d { font-size: calc(12px * var(--fs)); font-family: var(--font-mono); margin-top: 2px; color: var(--ok); }
  .kpi .d.neg { color: var(--err); }
  #rchart { margin-bottom: 18px; }
  #rtable { margin-bottom: 18px; }
  /* Grid.js dark re-skin */
  #rtable .gridjs-wrapper, #rtable .gridjs-table { background: transparent; box-shadow: none; }
  #rtable th.gridjs-th { background: rgba(var(--a1),.06); color: var(--cyan); border-color: var(--line); font-family: var(--font-mono); font-size: calc(11px * var(--fs)); letter-spacing: .1em; }
  #rtable td.gridjs-td, #rtable .gridjs-tr, #rtable .gridjs-tbody { background: transparent !important; color: var(--text); border-color: var(--line); font-size: calc(13px * var(--fs)); }
  #rtable .gridjs-tr:hover td { background: rgba(var(--a1),.06) !important; }
  #rtable .gridjs-search input, #rtable .gridjs-pagination { background: transparent; color: var(--dim); border-color: var(--line); }
  #rtable .gridjs-pagination button { background: transparent; color: var(--dim); border-color: var(--line); }
  #rtable .gridjs-pagination button.gridjs-currentPage { background: rgba(var(--a1),.12); color: var(--cyan); }
  #rmd { font-size: calc(14px * var(--fs)); line-height: 1.6; color: var(--text); }
  #rmd h1, #rmd h2, #rmd h3 { color: var(--cyan); margin: 12px 0 6px; font-family: var(--font-hud); }
  #rmd table { border-collapse: collapse; margin: 8px 0; }
  #rmd th, #rmd td { border: 1px solid var(--line); padding: 5px 10px; font-size: calc(13px * var(--fs)); }
  #rmd code { font-family: var(--font-mono); color: var(--amber); background: rgba(var(--a2),.08); padding: 1px 5px; }
  #rmd ul, #rmd ol { margin: 6px 0 6px 20px; }

  /* ------------------------------------------------ réglages (roue crantée) */
  #gear {
    width: calc(30px * min(var(--fs), 1.3)); height: calc(26px * min(var(--fs), 1.3)); cursor: pointer;
    background: rgba(var(--deep),.6); color: var(--text); border: 1px solid var(--line);
    font-size: calc(16px * min(var(--fs), 1.3)); line-height: 1; margin-left: 8px;
  }
  #gear:hover, #gear[aria-expanded="true"] { border-color: var(--cyan); color: var(--cyan); }
  #gear:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  #settings {
    position: fixed; top: 60px; left: 60px; bottom: 40px; width: min(calc(440px * min(var(--fs), 1.4)), calc(100vw - var(--side) - 120px));
    z-index: 30; display: none; flex-direction: column;
    background: rgba(var(--deep),.97); border: 1px solid var(--line); border-top: 2px solid var(--cyan);
    backdrop-filter: blur(14px); box-shadow: 0 0 60px rgba(0,0,0,.7); animation: materialize .35s ease;
  }
  #settings.open { display: flex; }
  #settings .rhead { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px 10px; }
  #settings .rhead h2 { font-size: calc(14px * var(--fs)); letter-spacing: .22em; text-transform: uppercase; color: var(--cyan); font-family: var(--font-mono); }
  #settings .rhead .x { cursor: pointer; color: var(--dim); font-size: calc(18px * var(--fs)); background: none; border: 0; }
  #settings .rhead .x:hover { color: var(--err); }
  #set-body { flex: 1; overflow-y: auto; padding: 0 20px 10px; }
  #set-body h3 {
    font-size: calc(11px * var(--fs)); letter-spacing: .22em; text-transform: uppercase; color: var(--amber);
    font-family: var(--font-mono); margin: 14px 0 8px; border-bottom: 1px solid var(--line); padding-bottom: 4px;
  }
  .set { margin-bottom: 12px; }
  .set label { display: flex; justify-content: space-between; gap: 10px; font-size: calc(14px * var(--fs)); font-weight: 600; color: var(--text); }
  .set label output { font-family: var(--font-mono); color: var(--cyan); font-weight: 400; font-size: calc(13px * var(--fs)); white-space: nowrap; }
  .set .help { font-size: calc(12px * var(--fs)); color: var(--dim); margin-top: 2px; }
  .set .err { font-size: calc(12px * var(--fs)); color: var(--err); margin-top: 2px; }
  .set input[type=range] { width: 100%; accent-color: var(--cyan); margin-top: 6px; }
  .set input[type=text], .set select {
    width: 100%; margin-top: 5px; background: rgba(var(--deep),.6); border: 1px solid var(--line); color: var(--text);
    padding: 6px 9px; font-family: var(--font-mono); font-size: calc(13px * var(--fs)); outline: none;
  }
  .set input[type=text]:focus, .set select:focus { border-color: var(--cyan); }
  .set select option { background: var(--bg); }
  .set.toggle label { align-items: center; cursor: pointer; }
  .set.toggle input { width: 18px; height: 18px; accent-color: var(--cyan); }
  .set.changed label > span::after { content: " •"; color: var(--amber); }
  #set-foot { display: flex; align-items: center; gap: 10px; padding: 12px 20px 16px; border-top: 1px solid var(--line); }
  #set-msg { flex: 1; font-size: calc(12px * var(--fs)); color: var(--dim); font-family: var(--font-mono); }
  #set-foot button {
    padding: 7px 16px; cursor: pointer; font-family: var(--font-hud); font-weight: 700; letter-spacing: .1em;
    font-size: calc(13px * var(--fs)); text-transform: uppercase; background: rgba(var(--deep),.6);
    color: var(--text); border: 1px solid var(--line);
  }
  #set-foot button:hover:not(:disabled) { border-color: var(--cyan); color: var(--cyan); }
  #set-save { border-color: var(--cyan-dim) !important; color: var(--cyan) !important; }
  #set-foot button:disabled { opacity: .35; cursor: default; }
</style>
</head>
<body>
  <canvas id="topo" aria-hidden="true"></canvas>
  <div class="corner tl"></div><div class="corner tr"></div>
  <div class="corner bl"></div><div class="corner br"></div>
  <div id="topbar">
    <span class="sys">◈ V.I.C.T.O.R.</span>
    <span id="fontctl" role="group" aria-label="Affichage"><button type="button" id="fullscreen" title="Plein écran" aria-label="Passer en plein écran" aria-pressed="false">⛶</button><button type="button" id="fs-down" title="Réduire le texte" aria-label="Réduire la taille du texte">A−</button><span id="fs-val" aria-live="polite">100 %</span><button type="button" id="fs-up" title="Agrandir le texte" aria-label="Agrandir la taille du texte">A+</button><button type="button" id="gear" title="Réglages" aria-label="Réglages" aria-expanded="false" aria-controls="settings">⚙</button></span>
    <span id="clock">--:--:--</span>
  </div>

  <div id="stage">
    <div id="transcript"></div>
    <div id="cards"></div>
    <canvas id="orb"></canvas>
    <div id="status">clique l'orbe pour <b>initialiser</b></div>
    <form id="ask" autocomplete="off"><input type="text" placeholder="… ou écris à VICTOR, puis Entrée" aria-label="Écrire à VICTOR"></form>
    <div id="hint">SYSTÈME LOCAL · GRADIUM · CLAUDE CODE</div>
  </div>
  <div id="report">
    <div class="rhead"><h2 id="rtitle"></h2><span class="x" onclick="document.getElementById('report').classList.remove('open')">✕</span></div>
    <div id="kpis"></div>
    <div id="rchart"></div>
    <div id="rtable"></div>
    <div id="rmd"></div>
  </div>

  <div id="settings" role="dialog" aria-labelledby="set-title">
    <div class="rhead"><h2 id="set-title">⚙ Réglages</h2><button type="button" class="x" id="set-close" aria-label="Fermer les réglages">✕</button></div>
    <div id="set-body"></div>
    <div id="set-foot">
      <span id="set-msg" aria-live="polite"></span>
      <button type="button" id="set-reset" disabled>Annuler</button>
      <button type="button" id="set-save" disabled>Enregistrer</button>
    </div>
  </div>

  <aside id="side">
    <h2>⟢ Sessions Claude Code</h2>
    <div id="tasks"><div id="empty">Aucune session. Demande une tâche à la voix.</div></div>
  </aside>

<script>
"use strict";
const orb = document.getElementById("orb");
const ctx = orb.getContext("2d");
const statusEl = document.getElementById("status");
const transcriptEl = document.getElementById("transcript");
const tasksEl = document.getElementById("tasks");
const emptyEl = document.getElementById("empty");
const cardsEl = document.getElementById("cards");
const hintEl = document.getElementById("hint");

let analyserIn = null, analyserOut = null;
let running = false;

/* clock */
setInterval(() => {
  document.getElementById("clock").textContent = new Date().toLocaleTimeString("fr-FR");
}, 1000);

/* ---------------------------------------------------------- palette (lue depuis les variables CSS) */
const THEME = {};
(function readTheme() {
  const cs = getComputedStyle(document.documentElement);
  const v = (n) => cs.getPropertyValue(n).trim();
  Object.assign(THEME, { a1: v("--a1"), a2: v("--a2"), core: v("--core"), coreDark: v("--core-dark"),
    dim: v("--dim"), text: v("--text"), series: [v("--s1"), v("--s2"), v("--s3")] });
})();

/* ---------------------------------------------------------- taille du texte (A− / A+) */
const FS_STEPS = [0.85, 1, 1.15, 1.3, 1.5, 1.75, 2];
let fsIdx = 1, lastReport = null;
function applyFontSize(i) {
  fsIdx = Math.max(0, Math.min(FS_STEPS.length - 1, i));
  document.documentElement.style.setProperty("--fs", FS_STEPS[fsIdx]);

/* ---------------------------------------------------------- utilitaires de dessin */
const TAU = Math.PI * 2;
let orbMode = "idle";          // idle | listening | thinking | speaking

/* petit générateur pseudo-aléatoire déterministe : même dessin à chaque chargement */
function rng(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let r = Math.imul(seed ^ seed >>> 15, 1 | seed);
    r = r + Math.imul(r ^ r >>> 7, 61 | r) ^ r;
    return ((r ^ r >>> 14) >>> 0) / 4294967296;
  };
}

/* ---------------------------------------------------------- fond : courbes de niveau */
function drawTopo() {
  const cv = document.getElementById("topo");
  if (!cv) return;
  const dpr = devicePixelRatio || 1;
  const W = innerWidth, H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  cv.style.width = W + "px"; cv.style.height = H + "px";
  const c = cv.getContext("2d");
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.clearRect(0, 0, W, H);

  // relief : quelques collines et combes gaussiennes + une ondulation de fond
  const rnd = rng(1914);
  const hills = [];
  for (let i = 0; i < 9; i++) {
    hills.push({ x: rnd() * 1.6 - 0.05, y: rnd() * 1.1 - 0.05,
                 h: (rnd() < 0.72 ? 1 : -0.7) * (0.5 + rnd()),
                 s: 0.10 + rnd() * 0.24 });
  }
  const field = (x, y) => {
    let z = 0.18 * Math.sin(2.6 * x + 1.1 * y) + 0.1 * Math.sin(5.3 * y - 1.7 * x + 0.8);
    for (const p of hills) {
      const dx = x - p.x, dy = y - p.y;
      z += p.h * Math.exp(-(dx * dx + dy * dy) / (2 * p.s * p.s));
    }
    return z;
  };

  const cell = 7;
  const nx = Math.ceil(W / cell) + 1, ny = Math.ceil(H / cell) + 1;
  const scale = 1 / H;
  const Z = new Float32Array(nx * ny);
  let zmin = Infinity, zmax = -Infinity;
  for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
    const z = field(i * cell * scale, j * cell * scale);
    Z[j * nx + i] = z;
    if (z < zmin) zmin = z; if (z > zmax) zmax = z;
  }

  const levels = 34, step = (zmax - zmin) / levels;
  const minor = new Path2D(), master = new Path2D();
  // marching squares : pour chaque niveau, segments entre les bords de cellule traversés
  for (let k = 1; k < levels; k++) {
    const lv = zmin + k * step;
    const path = k % 5 === 0 ? master : minor;
    for (let j = 0; j < ny - 1; j++) for (let i = 0; i < nx - 1; i++) {
      const a = Z[j * nx + i], b = Z[j * nx + i + 1];
      const d = Z[(j + 1) * nx + i], cc = Z[(j + 1) * nx + i + 1];
      const idx = (a > lv ? 8 : 0) | (b > lv ? 4 : 0) | (cc > lv ? 2 : 0) | (d > lv ? 1 : 0);
      if (idx === 0 || idx === 15) continue;
      const x = i * cell, y = j * cell;
      const top = () => [x + cell * (lv - a) / (b - a), y];
      const right = () => [x + cell, y + cell * (lv - b) / (cc - b)];
      const bottom = () => [x + cell * (lv - d) / (cc - d), y + cell];
      const left = () => [x, y + cell * (lv - a) / (d - a)];
      const seg = (p, q) => { path.moveTo(p[0], p[1]); path.lineTo(q[0], q[1]); };
      switch (idx) {
        case 1: case 14: seg(left(), bottom()); break;
        case 2: case 13: seg(bottom(), right()); break;
        case 3: case 12: seg(left(), right()); break;
        case 4: case 11: seg(top(), right()); break;
        case 6: case 9: seg(top(), bottom()); break;
        case 7: case 8: seg(left(), top()); break;
        case 5: seg(left(), top()); seg(bottom(), right()); break;
        case 10: seg(left(), bottom()); seg(top(), right()); break;
      }
    }
  }
  c.lineCap = "round";
  c.strokeStyle = `rgba(${THEME.a1},.075)`; c.lineWidth = 1; c.stroke(minor);
  c.strokeStyle = `rgba(${THEME.a2},.16)`; c.lineWidth = 1.4; c.stroke(master);
}
let _topoTimer = null;
window.addEventListener("resize", () => { clearTimeout(_topoTimer); _topoTimer = setTimeout(drawTopo, 150); });
drawTopo();

/* ---------------------------------------------------------- orbe : pelote de filaments organique */
function sizeOrb() {
  const r = orb.getBoundingClientRect();
  orb.width = r.width * devicePixelRatio; orb.height = r.height * devicePixelRatio;
}
window.addEventListener("resize", sizeOrb); sizeOrb();

function level(analyser) {
  if (!analyser) return 0;
  const buf = new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteFrequencyData(buf);
  let s = 0; for (const v of buf) s += v;
  return s / buf.length / 255;
}

// Pelote de filaments, comme un mycélium : des centaines de fils qui errent sur
// une sphère (et un peu dedans). Projetés en 3D et additionnés, ils se densifient
// vers le bord, ce qui dessine la sphère sans aucun contour.
const FIL_COLORS = ["242,235,214", "242,235,214", "242,235,214", "222,228,210", "130,214,190", "100,190,170"];
const FIBERS = (() => {
  const rnd = rng(2047);
  const N = 560, STEPS = 46, STEP = 0.07;
  const fibers = [];
  for (let f = 0; f < N; f++) {
    // départ : point aléatoire sur la sphère, direction tangente aléatoire
    let z = rnd() * 2 - 1, a = rnd() * TAU, q = Math.sqrt(1 - z * z);
    let p = [q * Math.cos(a), q * Math.sin(a), z];
    let d = [rnd() - 0.5, rnd() - 0.5, rnd() - 0.5];
    const shell = rnd() < 0.75 ? 0.93 + rnd() * 0.07 : 0.55 + rnd() * 0.38;  // surtout en surface
    const pts = new Float32Array(STEPS * 3);
    let bend = (rnd() - 0.5) * 0.6;
    for (let i = 0; i < STEPS; i++) {
      // direction rendue tangente, puis légèrement tournée : un fil qui ondule
      const dot = d[0] * p[0] + d[1] * p[1] + d[2] * p[2];
      d = [d[0] - dot * p[0], d[1] - dot * p[1], d[2] - dot * p[2]];
      const side = [p[1] * d[2] - p[2] * d[1], p[2] * d[0] - p[0] * d[2], p[0] * d[1] - p[1] * d[0]];
      bend += (rnd() - 0.5) * 0.5; bend *= 0.9;
      d = [d[0] + side[0] * bend, d[1] + side[1] * bend, d[2] + side[2] * bend];
      const dl = Math.hypot(d[0], d[1], d[2]) || 1;
      p = [p[0] + d[0] / dl * STEP, p[1] + d[1] / dl * STEP, p[2] + d[2] / dl * STEP];
      const pl = Math.hypot(p[0], p[1], p[2]);
      p = [p[0] / pl, p[1] / pl, p[2] / pl];
      pts[i * 3] = p[0] * shell; pts[i * 3 + 1] = p[1] * shell; pts[i * 3 + 2] = p[2] * shell;
    }
    fibers.push({ pts, color: FIL_COLORS[Math.floor(rnd() * FIL_COLORS.length)], alpha: 0.22 + rnd() * 0.30 });
  }
  return fibers;
})();
const DEPTH_BANDS = 4;                         // regroupe les fils par profondeur pour peu d'appels stroke()
let t = 0, eIn = 0, eOut = 0, spin = 0, pulse = 0;

function draw() {
  requestAnimationFrame(draw);
  t += 0.016;
  const w = orb.width, h = orb.height, cx = w / 2, cy = h / 2;
  const dpr = devicePixelRatio;
  ctx.clearRect(0, 0, w, h);

  // niveaux lissés : aucun sursaut brusque
  eIn += (level(analyserIn) - eIn) * 0.08;
  eOut += (level(analyserOut) - eOut) * 0.1;
  const idle = orbMode === "idle", thinking = orbMode === "thinking";
  spin += 0.016 * (thinking ? 0.55 : 0.12);
  pulse += 0.016 * (2 + eOut * 10);

  const R = Math.min(w, h) * 0.38 * (1 - eIn * 0.12 + eOut * 0.08);   // ta voix resserre la pelote
  const bright = (idle ? 0.85 : 1) * (1 + eIn * 0.9 + eOut * 0.6);
  const cyaw = Math.cos(spin), syaw = Math.sin(spin);
  const tilt = 0.35 + 0.08 * Math.sin(t * 0.21), ct = Math.cos(tilt), st = Math.sin(tilt);
  const lump = 0.05 + eOut * 0.10 + (thinking ? 0.03 : 0);              // bosses organiques
  const wave = eOut * 0.09;                                             // ondes quand VICTOR parle

  const paths = {};
  for (const fib of FIBERS) {
    const P = fib.pts, n = P.length / 3;
    let path = null, zsum = 0;
    const xy = new Float32Array(n * 2);
    for (let i = 0; i < n; i++) {
      let x = P[i * 3], y = P[i * 3 + 1], z = P[i * 3 + 2];
      // déformation lente et irrégulière de la surface : la sphère respire
      const k = 1 + lump * (Math.sin(2.1 * x + 1.3 * z + t * 0.7) * Math.cos(1.7 * y - t * 0.5)
                 + 0.5 * Math.sin(3.3 * y + 2.2 * x - t * 0.9))
              + wave * Math.sin(9 * y - pulse * 3);
      x *= k; y *= k; z *= k;
      const x1 = x * cyaw + z * syaw, z1 = -x * syaw + z * cyaw;        // rotation verticale
      const y2 = y * ct - z1 * st, z2 = y * st + z1 * ct;               // inclinaison
      xy[i * 2] = cx + x1 * R; xy[i * 2 + 1] = cy + y2 * R;
      zsum += z2;
    }
    const band = Math.max(0, Math.min(DEPTH_BANDS - 1, Math.floor((zsum / n + 1) / 2 * DEPTH_BANDS)));
    const key = fib.color + "|" + band;
    path = paths[key] || (paths[key] = { p: new Path2D(), color: fib.color, band, a: 0, c: 0 });
    path.a += fib.alpha; path.c++;
    path.p.moveTo(xy[0], xy[1]);
    for (let i = 1; i < n - 1; i++) {                                    // courbes lissées
      const mx = (xy[i * 2] + xy[i * 2 + 2]) / 2, my = (xy[i * 2 + 1] + xy[i * 2 + 3]) / 2;
      path.p.quadraticCurveTo(xy[i * 2], xy[i * 2 + 1], mx, my);
    }
  }

  ctx.save();
  ctx.globalCompositeOperation = "lighter";    // les croisements s'additionnent et brillent
  ctx.lineCap = "round";
  for (const k in paths) {
    const g = paths[k];
    const depth = 0.45 + 0.55 * (g.band + 0.5) / DEPTH_BANDS;           // l'arrière s'estompe
    ctx.strokeStyle = `rgba(${g.color},${Math.min(0.85, (g.a / g.c) * depth * bright)})`;
    ctx.lineWidth = (0.6 + 0.45 * depth) * dpr;
    ctx.stroke(g.p);
  }
  // halo très léger au cœur
  const halo = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * 1.15);
  halo.addColorStop(0, `rgba(126,204,184,${0.035 * bright})`);
  halo.addColorStop(1, "rgba(126,204,184,0)");
  ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(cx, cy, R * 1.15, 0, TAU); ctx.fill();
  ctx.restore();
}
draw();

/* ---------------------------------------------------------- voice session (Gradium + Claude, via le serveur local) */
const RATE = 24000, FRAME = 1920;            // 80 ms à 24 kHz, format attendu par Gradium
let ws = null, ac = null, micStream = null, workletNode = null, outGain = null;
let playHead = 0, sources = [], idleTimer = null, newReply = true;

// Capture micro -> PCM 16 bits 24 kHz mono, par paquets de 80 ms.
const WORKLET = `
class Capture extends AudioWorkletProcessor {
  constructor() {
    super();
    this.ratio = sampleRate / ${RATE};
    this.t = 0; this.prev = 0;
    this.buf = new Int16Array(${FRAME}); this.n = 0;
  }
  push(v) {
    v = Math.max(-1, Math.min(1, v));
    this.buf[this.n++] = v < 0 ? v * 32768 : v * 32767;
    if (this.n === ${FRAME}) { this.port.postMessage(this.buf.slice().buffer); this.n = 0; }
  }
  process(inputs) {
    const x = inputs[0] && inputs[0][0];
    if (!x) return true;
    const L = x.length;
    while (this.t + 1 < L) {                     // interpolation linéaire -> 24 kHz
      const i = Math.floor(this.t), f = this.t - i;
      const a = i < 0 ? this.prev : x[i];
      this.push(a + (x[i + 1] - a) * f);
      this.t += this.ratio;
    }
    this.prev = x[L - 1];
    this.t -= L;
    return true;
  }
}
registerProcessor("capture", Capture);`;

async function start() {
  if (ws) return stop();
  statusEl.innerHTML = "<b>connexion…</b>";
  try {
    ac = new AudioContext();
    outGain = ac.createGain();
    analyserOut = ac.createAnalyser(); analyserOut.fftSize = 256;
    outGain.connect(analyserOut); analyserOut.connect(ac.destination);

    try {
      micStream = await navigator.mediaDevices.getUserMedia({ audio: {
        echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 } });
      await ac.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET], { type: "application/javascript" })));
      const src = ac.createMediaStreamSource(micStream);
      analyserIn = ac.createAnalyser(); analyserIn.fftSize = 256;
      src.connect(analyserIn);
      workletNode = new AudioWorkletNode(ac, "capture");
      const mute = ac.createGain(); mute.gain.value = 0;   // garde le nœud actif sans renvoyer le micro
      src.connect(workletNode); workletNode.connect(mute); mute.connect(ac.destination);
      workletNode.port.onmessage = (e) => { if (ws && ws.readyState === 1) ws.send(e.data); };
    } catch (micErr) {
      micStream = null;
      addCard("Micro indisponible", `Le micro n'a pas pu être ouvert (${micErr.message}). Tu peux écrire à VICTOR dans le champ sous l'orbe.`, "warning");
    }

    const sock = new WebSocket(`ws://${location.host}/ws`);
    sock.binaryType = "arraybuffer";
    sock.onmessage = (e) => typeof e.data === "string" ? handleEvent(JSON.parse(e.data)) : playPcm(e.data);
    await new Promise((res, rej) => { sock.onopen = res; sock.onerror = () => rej(new Error("serveur injoignable")); });
    sock.onclose = () => {
      if (ws === sock) { stop(); statusEl.innerHTML = `<b style="color:var(--err)">déconnecté</b> · clique l'orbe pour relancer`; }
    };
    ws = sock;
  } catch (err) {
    stop();
    statusEl.innerHTML = `<b style="color:var(--err)">erreur</b> · ${esc(err.message)}`;
  }
}

function stop() {
  orbMode = "idle";
  const sock = ws; ws = null;
  if (sock) sock.close();
  clearAudio();
  if (micStream) micStream.getTracks().forEach(t => t.stop());
  if (ac) ac.close();
  micStream = ac = workletNode = outGain = null;
  analyserIn = analyserOut = null;
  setEar(false);
  statusEl.innerHTML = "clique l'orbe pour <b>initialiser</b>";
}
orb.addEventListener("click", start);

function send(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }

/* ---------------------------------------------------------- lecture de la voix (PCM 24 kHz en flux) */
function playPcm(buf) {
  if (!ac) return;
  const i16 = new Int16Array(buf);
  if (!i16.length) return;
  const f = new Float32Array(i16.length);
  for (let i = 0; i < i16.length; i++) f[i] = i16[i] / 32768;
  const ab = ac.createBuffer(1, f.length, RATE);
  ab.copyToChannel(f, 0);
  const s = ac.createBufferSource();
  s.buffer = ab; s.connect(outGain);
  const now = ac.currentTime;
  if (playHead < now + 0.02) playHead = now + 0.06;   // petit tampon anti-saccades
  s.start(playHead);
  playHead += ab.duration;
  sources.push(s);
  clearTimeout(idleTimer);
  s.onended = () => {
    sources = sources.filter(x => x !== s);
    if (!sources.length) idleTimer = setTimeout(() => { if (!sources.length) send({ type: "playback_idle" }); }, 250);
  };
}

function clearAudio() {
  for (const s of sources) { try { s.onended = null; s.stop(); } catch (_) {} }
  sources = []; playHead = 0; clearTimeout(idleTimer);
}

/* ---------------------------------------------------------- événements du serveur */
const STATES = {
  listening: `<b>à l'écoute</b> · à votre service, monsieur`,
  thinking: `<b>réflexion…</b>`,
  speaking: `<b>VICTOR parle</b> · parlez pour l'interrompre`,
};
function setEar(open) {
  hintEl.textContent = `SYSTÈME LOCAL · GRADIUM · CLAUDE CODE · OREILLE ${open ? "ACTIVE" : "EN VEILLE"}`;
}

function handleEvent(ev) {
  switch (ev.type) {
    case "state":
      orbMode = ev.state;
      if (STATES[ev.state]) statusEl.innerHTML = STATES[ev.state];
      break;
    case "ear":
      setEar(ev.open);
      break;
    case "user_partial":
    case "user_final":
      transcriptEl.classList.add("user");
      transcriptEl.textContent = `« ${ev.text} »`;
      newReply = true;
      break;
    case "assistant_text":
      if (newReply) { transcriptEl.textContent = ""; transcriptEl.classList.remove("user"); newReply = false; }
      transcriptEl.textContent += ev.delta.replace(/[*#`_~]/g, "");
      break;
    case "assistant_done":
      newReply = true;
      break;
    case "clear_audio":
      clearAudio();
      break;
    case "card":
      addCard(ev.title || "Info", ev.content || "", ev.kind || "info");
      break;
    case "report":
      try { showReport(ev.report || {}); } catch (err) { addCard("Rapport", String(err), "warning"); }
      break;
    case "task_started":
      addTaskCard(ev.task.id, ev.task.title, ev.multi_espaces ? ev.task.espace : null);
      break;
    case "task_update":
      updateTaskCard(ev.task);
      break;
    case "error":
      addCard("Erreur", ev.message || "erreur inconnue", "warning");
      break;
  }
}

/* ---------------------------------------------------------- display cards */
function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function mdLite(s) {
  // minimal markdown: **bold**, `code`, "- " bullets
  let html = esc(s)
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/`([^`]+)`/g, "<code>$1</code>");
  const lines = html.split("\n");
  let out = "", inList = false;
  for (const l of lines) {
    if (l.startsWith("- ")) {
      if (!inList) { out += "<ul>"; inList = true; }
      out += `<li>${l.slice(2)}</li>`;
    } else {
      if (inList) { out += "</ul>"; inList = false; }
      out += l + "\n";
    }
  }
  if (inList) out += "</ul>";
  return out.trimEnd();
}

function addCard(title, content, kind) {
  const el = document.createElement("div");
  el.className = `card ${kind}`;
  el.innerHTML = `<h3><span>${esc(title)}</span><span class="x" title="fermer">✕</span></h3>
    <div class="body">${mdRender(content)}</div>`;
  el.querySelector(".x").addEventListener("click", () => el.remove());
  addClipButtons(el, kind);
  cardsEl.prepend(el);
  // keep at most 6 cards
  while (cardsEl.children.length > 6) cardsEl.lastChild.remove();
}

function showReport(r) {

      theme: { mode: "dark" },
      colors: THEME.series,
      stroke: { width: 2, curve: "straight" },
      grid: { borderColor: `rgba(${THEME.a1},.12)`, strokeDashArray: 3 },
      dataLabels: { enabled: false },
      legend: { show: nSeries > 1, labels: { colors: THEME.text }, fontSize: `${Math.round(13 * fs)}px` },
      tooltip: { theme: "dark", style: { fontSize: `${Math.round(12 * fs)}px` } },
      yaxis: { labels: { style: { fontSize: `${Math.round(12 * fs)}px` } } },
      series: donut ? c.series[0].data : c.series,
    };
    if (donut) opts.labels = c.categories || [];
    else opts.xaxis = { categories: c.categories || [], labels: { style: { fontSize: `${Math.round(12 * fs)}px` } } };
    if (c.type === "area") opts.fill = { type: "gradient", gradient: { opacityFrom: .3, opacityTo: .02 } };
    _apex = new ApexCharts(chartEl, opts);
    _apex.render();
  }

  // Table (Grid.js)
  const tableEl = document.getElementById("rtable");
  if (_grid) { _grid.destroy(); _grid = null; }
  tableEl.innerHTML = "";
  const t = r.table;
  if (t && window.gridjs && (t.rows || []).length) {
    _grid = new gridjs.Grid({
      columns: t.columns || [],
      data: t.rows,
      sort: true,
      search: t.rows.length > 8,
      pagination: t.rows.length > 12 ? { limit: 10 } : false,
      style: { table: { "font-family": "Rajdhani, sans-serif" } },
    });
    _grid.render(tableEl);
  }

  // Markdown notes
  document.getElementById("rmd").innerHTML = r.markdown ? mdRender(r.markdown) : "";

  rep.classList.add("open");
}

/* ---------------------------------------------------------- task cards */
function addTaskCard(id, title, espace) {
  emptyEl.remove();
  const el = document.createElement("div");
  el.className = "task"; el.id = `task-${id}`;
  const badge = espace ? `<span class="esp" title="espace de travail">${esc(espace)}</span>` : "";
  el.innerHTML = `<div class="t">${esc(title)}${badge}</div>
    <div class="s"><span class="dot"></span><span class="lbl">Claude Code travaille…</span> <span class="chrono">0s</span>
    <span class="cancel" title="annuler">✕</span></div>
    <div class="out"></div>`;
  el.querySelector(".cancel").addEventListener("click", () => cancelTask(null, id));
  tasksEl.prepend(el);
  el.dataset.start = Date.now();
  el._timer = setInterval(() => {
    el.querySelector(".chrono").textContent = Math.round((Date.now() - el.dataset.start) / 1000) + "s";
  }, 1000);
}

function updateTaskCard(task) {
  const el = document.getElementById(`task-${task.id}`);
  if (!el) return;
  if (task.status !== "running") {
    clearInterval(el._timer);
    const cls = { done: "done", cancelled: "cancelled" }[task.status] || "error";
    const lbl = { done: "Terminé", cancelled: "Annulée" }[task.status] || "Erreur";
    el.classList.add(cls);
    el.querySelector(".lbl").textContent = lbl;
    el.querySelector(".out").textContent = (task.output || "").slice(0, 1200);
    // la croix n'annule plus : elle retire la session terminée du panneau
    const c = el.querySelector(".cancel");
    if (c) {
      c.title = "fermer";
      c.replaceWith(c.cloneNode(true));          // retire l'écouteur « annuler »
      el.querySelector(".cancel").addEventListener("click", () => removeTaskCard(el));
    }
  }
}

function removeTaskCard(el) {
  clearInterval(el._timer);
  el.remove();
  if (!tasksEl.querySelector(".task")) tasksEl.appendChild(emptyEl);
}

/* ---------------------------------------------------------- réglages (roue crantée) */
const setPanel = document.getElementById("settings");
const setBody = document.getElementById("set-body");
const setMsg = document.getElementById("set-msg");
const setSave = document.getElementById("set-save");
const setReset = document.getElementById("set-reset");
const gearBtn = document.getElementById("gear");
let setSchema = [], setInitial = {}, setBusy = 0;

function fmtNum(v, step) {
  const d = String(step).includes(".") ? String(step).split(".")[1].length : 0;
  return Number(v).toFixed(d).replace(".", ",");
}

function settingControl(spec, value) {
  const el = document.createElement("div");
  el.className = "set" + (spec.type === "toggle" ? " toggle" : "");
  el.dataset.key = spec.key;
  const id = "set-" + spec.key;
  const help = spec.help ? `<div class="help">${esc(spec.help)}</div>` : "";
  if (spec.type === "range") {
    const vals = spec.values;                        // curseur sur une liste de valeurs fixes
    const min = vals ? 0 : spec.min, max = vals ? vals.length - 1 : spec.max, step = vals ? 1 : spec.step;
    const pos = vals ? vals.reduce((b, x, i) => Math.abs(x - value) < Math.abs(vals[b] - value) ? i : b, 0) : value;
    el.innerHTML = `<label for="${id}"><span>${esc(spec.label)}</span><output></output></label>
      <input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${pos}">${help}`;
    const inp = el.querySelector("input"), out = el.querySelector("output");
    el.read = () => vals ? vals[+inp.value] : +inp.value;
    const show = () => { out.textContent = fmtNum(el.read(), vals ? 0.1 : spec.step) + (spec.unit ? " " + spec.unit : ""); };
    inp.addEventListener("input", show); show();
  } else if (spec.type === "toggle") {
    el.innerHTML = `<label for="${id}"><span>${esc(spec.label)}</span><input type="checkbox" id="${id}" ${value ? "checked" : ""}></label>${help}`;
    el.read = () => el.querySelector("input").checked;
  } else if (spec.type === "select") {
    const opts = Object.entries(spec.options).map(([k, l]) =>
      `<option value="${esc(k)}" ${k === String(value) ? "selected" : ""}>${esc(l)}</option>`).join("");
    el.innerHTML = `<label for="${id}"><span>${esc(spec.label)}</span></label><select id="${id}">${opts}</select>${help}`;
    el.read = () => el.querySelector("select").value;
  } else {
    const list = spec.suggest ? `<datalist id="${id}-dl">${spec.suggest.map(o => `<option value="${esc(o)}">`).join("")}</datalist>` : "";
    el.innerHTML = `<label for="${id}"><span>${esc(spec.label)}</span></label>
      <input type="text" id="${id}" ${spec.suggest ? `list="${id}-dl"` : ""} spellcheck="false">${list}${help}`;
    el.querySelector("input").value = value;
    el.read = () => el.querySelector("input").value.trim();
  }
  return el;
}

function settingsChanged() {
  const changed = {};
  for (const el of setBody.querySelectorAll(".set")) {
    const v = el.read(), k = el.dataset.key;
    const diff = String(v) !== String(setInitial[k]);
    el.classList.toggle("changed", diff);
    if (diff) changed[k] = v;
  }
  return changed;
}
function refreshSettingsState() {
  const n = Object.keys(settingsChanged()).length;
  setSave.disabled = setReset.disabled = n === 0;
  setMsg.style.color = "";
  setMsg.textContent = n ? `${n} modification${n > 1 ? "s" : ""}` + (setBusy ? ` · ⚠ ${setBusy} tâche en cours sera arrêtée` : "") : "";
}

function renderSettings() {
  setBody.innerHTML = "";
  let group = null;
  for (const spec of setSchema) {
    if (spec.group !== group) {
      group = spec.group;
      setBody.insertAdjacentHTML("beforeend", `<h3>${esc(group)}</h3>`);
    }
    setBody.appendChild(settingControl(spec, setInitial[spec.key]));
  }
  refreshSettingsState();
}

async function openSettings() {
  setPanel.classList.add("open"); gearBtn.setAttribute("aria-expanded", "true");
  setBody.innerHTML = `<div class="help">chargement…</div>`;
  try {
    const r = await fetch("/api/settings");
    const data = await r.json();
    setSchema = data.schema; setInitial = data.values; setBusy = data.busy;
    renderSettings();
  } catch (err) {
    setBody.innerHTML = `<div class="err">Réglages indisponibles : ${esc(err.message)}</div>`;
  }
}
function closeSettings() { setPanel.classList.remove("open"); gearBtn.setAttribute("aria-expanded", "false"); }

gearBtn.addEventListener("click", () => setPanel.classList.contains("open") ? closeSettings() : openSettings());
document.getElementById("set-close").addEventListener("click", closeSettings);
setBody.addEventListener("input", refreshSettingsState);
setBody.addEventListener("change", refreshSettingsState);
setReset.addEventListener("click", renderSettings);

setSave.addEventListener("click", async () => {
  const changed = settingsChanged();
  if (!Object.keys(changed).length) return;
  setSave.disabled = setReset.disabled = true;
  setBody.querySelectorAll(".err").forEach(e => e.remove());
  setMsg.style.color = ""; setMsg.textContent = "enregistrement…";
  let r;
  try {
    r = await fetch("/api/settings", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(changed) });
  } catch (err) {
    setMsg.style.color = "var(--err)"; setMsg.textContent = "serveur injoignable"; refreshSettingsState(); return;
  }
  if (!r.ok) {
    const detail = (await r.json().catch(() => ({}))).detail || {};
    for (const [k, msg] of Object.entries(typeof detail === "object" ? detail : {})) {
      const el = setBody.querySelector(`.set[data-key="${k}"]`);
      if (el) el.insertAdjacentHTML("beforeend", `<div class="err">${esc(String(msg))}</div>`);
    }
    refreshSettingsState();
    setMsg.style.color = "var(--err)"; setMsg.textContent = "certaines valeurs sont invalides";
    return;
  }
  // .env mis à jour : le serveur se relance, on attend qu'il réponde puis on recharge la page.
  if (ws) stop();
  setMsg.textContent = "redémarrage du serveur…";
  statusEl.innerHTML = "<b>redémarrage…</b>";
  await new Promise(res => setTimeout(res, 1200));
  for (let i = 0; i < 40; i++) {
    try { if ((await fetch("/api/settings", { cache: "no-store" })).ok) { location.reload(); return; } } catch (_) {}
    await new Promise(res => setTimeout(res, 500));
  }
  setMsg.style.color = "var(--err)"; setMsg.textContent = "le serveur ne répond plus : relance-le à la main";
});

/* ---------------------------------------------------------- copier / coller dans une autre fenêtre */
// Sous chaque bloc de code d'une carte : copier, ou coller dans une autre fenêtre
// (le serveur passe par le presse-papiers et ydotool, après 3 s pour cliquer la cible).
function addClipButtons(card, kind) {
  const blocks = [...card.querySelectorAll(".body pre")];
  if (!blocks.length && kind === "code") blocks.push(card.querySelector(".body"));
  for (const block of blocks) {
    const text = () => block.innerText.replace(/\n$/, "");
    const bar = document.createElement("div");
    bar.className = "clip";
    bar.innerHTML = `<button type="button" data-act="copy" title="Copier dans le presse-papiers">⧉ copier</button>
      <button type="button" data-act="term" title="Coller dans un terminal (Ctrl+Maj+V) : clique dans la fenêtre dans les 3 s">⇥ terminal</button>
      <button type="button" data-act="app" title="Coller dans une application (Ctrl+V) : clique dans la fenêtre dans les 3 s">⇥ appli</button>`;
    bar.addEventListener("click", (e) => {
      const b = e.target.closest("button");
      if (b) clipAction(b, b.dataset.act, text());
    });
    block.after(bar);
  }
}

async function clipAction(btn, act, text) {
  const label = btn.textContent;
  const flash = (msg, ms = 1500) => { btn.textContent = msg; setTimeout(() => { btn.textContent = label; btn.disabled = false; }, ms); };
  btn.disabled = true;
  if (act === "copy") {
    try { await navigator.clipboard.writeText(text); flash("✓ copié"); } catch (_) { flash("✗ refusé"); }
    return;
  }
  let n = 3;
  btn.textContent = `clique la cible… ${n}`;
  const tick = setInterval(() => { if (--n > 0) btn.textContent = `clique la cible… ${n}`; }, 1000);
  try {
    const r = await fetch("/api/paste", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text, target: "click", terminal: act === "term", delay: 3 }) });
    const res = await r.json();
    clearInterval(tick);
    if (res.ok) flash("✓ collé");
    else { flash("✗ échec", 2500); addCard("Collage impossible", res.error || "erreur inconnue", "warning"); }
  } catch (err) {
    clearInterval(tick); flash("✗ échec", 2500);
  }
}
